<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Supplier Explorer</title>

<style>
:root{
  --blue:#003B5D;
  --light:#f8fafc;
}

body{font-family:Arial;margin:0}

/* HEADER */
header{background:var(--blue);color:white;padding:20px}
h1{margin:0}

/* PANEL */
.panel{
  margin:15px;
  background:var(--light);
  border-radius:10px;
  padding:10px;
}

/* GRID */
.grid{
  display:grid;
  gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}

input,select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
  background:white;
  font-size:14px;
}
/* BUTTON */
button{
  padding:8px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.primary{background:#1A3FD8;color:white}
.delete{color:red;background:none}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:white;
}

th,td{
  border:1px solid #ddd;
  padding:6px;
}

tr:hover{background:#eef5ff}

</style>
</head>

<h1>🔎 Supplier Explorer</h1>
</header>

<div class="grid">

<input id="search" placeholder="Search">

<select id="category"></select>
<select id="subcategory"></select>
<select id="manufacturer"></select>
<select id="vendor"></select>

<button onclick="addRow()">➕ Add</button>
<button onclick="adminLogin()">🔒 Admin Mode</button>

const rows = () => document.querySelectorAll("#table tbody tr");

function populate(){

  let cat = new Set(),
      sub = new Set(),
      man = new Set(),
      ven = new Set();

  rows().forEach(r=>{

    cat.add(r.children[0].innerText);
    sub.add(r.children[1].innerText);
    man.add(r.children[2].innerText);

    ven.add(r.children[3].innerText);
    ven.add(r.children[4].innerText);
    ven.add(r.children[5].innerText);

  });

  fill("category",cat,"All Categories");
  fill("subcategory",sub,"All Subcategories");
  fill("manufacturer",man,"All Manufacturers");
  fill("vendor",ven,"All Vendors");
}
function fill(id,set,label){

  let s = document.getElementById(id);

  s.innerHTML = `<option value="">${label}</option>`;

  [...set].sort().forEach(v=>{

    if(v && v.toLowerCase() !== "nan"){

      let o = document.createElement("option");

      o.text = v
        .toLowerCase()
        .replace(/\b\w/g, l => l.toUpperCase());

      o.value = v;

      s.add(o);

    }

  });

}
function filter(){

  let q = search.value.toLowerCase();

  let c = category.value;
  let s = subcategory.value;
  let m = manufacturer.value;
  let v = vendor.value;

  rows().forEach(r=>{

    let txt = r.innerText.toLowerCase();

    let ven = [
      r.children[3].innerText,
      r.children[4].innerText,
      r.children[5].innerText
    ];

    let show =
      (!q || txt.includes(q)) &&
      (!c || r.children[0].innerText == c) &&
      (!s || r.children[1].innerText == s) &&
      (!m || r.children[2].innerText == m) &&
      (!v || ven.includes(v));

    r.style.display = show ? "" : "none";

  });
}

function addDeleteBtn(row){
  if(isAdmin){
    let c=row.insertCell(6);
    c.innerHTML=`<button class="delete" onclick="del(this)">❌</button>`;
  }
}

function adminLogin(){
  let p = prompt("Enter password");

  // If user clicked Cancel, do nothing
  if (p === null) {
    return;
  }

  if (p === "admin123") {
    isAdmin = true;

    rows().forEach(r => {
      for (let i = 0; i < 6; i++) {
        r.children[i].contentEditable = true;
      }
      if (r.children.length < 7) {
        addDeleteBtn(r);
      }
    });

    alert("Admin mode enabled");
  } else {
    alert("Wrong password");
  }
}
search.oninput=filter;
category.onchange=filter;
subcategory.onchange=filter;
manufacturer.onchange=filter;
vendor.onchange=filter;

function cleanNan(){
  rows().forEach(r=>{
    for(let i=0;i<6;i++){
      let cell = r.children[i];

      if(cell.innerText.trim().toLowerCase() === "nan"){
        cell.innerText = "";
      }
    }
  });
}
async function saveData(){

  let data = [];

  rows().forEach(r => {

    let row = [];

    for(let i=0;i<6;i++){
      row.push(r.children[i].innerText.trim());
    }

    data.push(row);

  });

  await setDoc(doc(db, "supplier", "master"), {
    data: data
  });

}

async function loadData(){

  const snap = await getDoc(doc(db, "supplier", "master"));

  if(!snap.exists()) return false;

  const data = snap.data().data;

  let tbody = document.querySelector("#table tbody");

  tbody.innerHTML = "";

  data.forEach(row => {

    let r = tbody.insertRow();

    row.forEach(cell => {

      let c = r.insertCell();

      c.contentEditable = isAdmin;

      c.innerText = cell;

    });

    if(isAdmin){
      addDeleteBtn(r);
    }

  });

  return true;

}


async function addRow(){

  if(!isAdmin){
    alert("Admin only");
    return;
  }

  let t=document.querySelector("#table tbody");
  let r=t.insertRow();

  for(let i=0;i<6;i++){
    let c=r.insertCell(i);
    c.contentEditable=true;
  }

  addDeleteBtn(r);

  await saveData();

  populate();
}
async function del(btn){

  if(!isAdmin){
    alert("Admin only");
    return;
  }

  btn.closest("tr").remove();

  await saveData();

  populate();

}
function capitalizeTable(){

  const keepUpper = [
    "ABB","FS","GE","HP","APC","RSA",
    "RTDS","INS","SQD","BAE","ERL","XHF",
    "OCC","RAM","IT","UPC","KVM","SHI"
  ];

  rows().forEach(r=>{

    for(let i=0;i<6;i++){

      let cell = r.children[i];
      let text = cell.innerText.trim();

      if(keepUpper.includes(text.toUpperCase())){
        cell.innerText = text.toUpperCase();
      }
      else{
        cell.innerText = text
          .toLowerCase()
          .replace(/\b\w/g, l => l.toUpperCase());
      }

    }

  });
}

function renderTable(){

  const tbody = document.getElementById("tableBody");

  tbody.innerHTML = "";

  supplierData.forEach(row => {

    let tr = document.createElement("tr");

    row.forEach(cellData => {

      let td = document.createElement("td");

      td.contentEditable = isAdmin;

      td.innerText = cellData;

      tr.appendChild(td);

    });

    tbody.appendChild(tr);

  });

}
window.onload = async function(){

  let loaded = await loadData();

  if(!loaded){

    renderTable();

    await saveData();

  }

  cleanNan();

  capitalizeTable();

  populate();

  filter();

  document.querySelector("#table").addEventListener("input", async () => {

    if(isAdmin){

      await saveData();

      populate();

    }

  });

};
